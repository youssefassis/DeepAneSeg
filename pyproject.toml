[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deepaneseg"
version = "0.1.0"
description = "Detection of brain aneurysms from MRA with a 3D U-Net and an efficient data strategy (DALI @ MICCAI 2021)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Youssef Assis" }]
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "pandas",
    "nibabel",
    "SimpleITK",
    "torch",
    "tensorboard",
    "tqdm",
    "prefetch_generator",
    "hydra-core>=1.3",
]

[project.scripts]
deepaneseg-remove-skull = "deepaneseg.cli.remove_skull:main"
deepaneseg-extract-points = "deepaneseg.cli.extract_points:main"
deepaneseg-preprocess = "deepaneseg.cli.preprocess:main"
deepaneseg-train = "deepaneseg.cli.train:main"
deepaneseg-predict = "deepaneseg.cli.predict:main"
deepaneseg-evaluate = "deepaneseg.cli.evaluate:main"

[project.optional-dependencies]
# PyTorch build, for uv: `uv sync --extra cpu` or `uv sync --extra cu126` (see [tool.uv.sources])
cpu = ["torch"]
cu126 = ["torch"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
include = ["deepaneseg*"]

[tool.setuptools.package-data]
deepaneseg = ["configs/*.yaml", "configs/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# still references TensorFlow from an earlier port and computes metrics it never reports;
# kept until its fate is decided
"scripts/experimental/evaluate.py" = ["F821", "F841"]
