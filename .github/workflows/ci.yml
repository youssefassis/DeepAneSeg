name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (CPU-only PyTorch, from uv.lock)
        run: uv sync --locked --extra cpu
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build and install the wheel outside the repository
        run: |
          uv build --wheel -o /tmp/dist
          uv venv /tmp/venv
          VIRTUAL_ENV=/tmp/venv uv pip install /tmp/dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Run the commands from another folder
        working-directory: /tmp
        run: |
          mkdir -p data/P0001 && echo '{}' > data/P0001/config.json
          /tmp/venv/bin/deepaneseg-train --help
          /tmp/venv/bin/deepaneseg-preprocess data_dir=data
          test -f data/0Work/split_pats.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (CPU PyTorch)
        run: docker build -t deepaneseg:cpu --build-arg TORCH=cpu .
      - name: Smoke test
        run: |
          docker run --rm deepaneseg:cpu python -c "import torch, deepaneseg.utils; print(torch.__version__)"
          docker run --rm deepaneseg:cpu deepaneseg-train --help
